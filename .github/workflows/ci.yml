
name: CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests with coverage
        run: npm run test:coverage

      - name: Update coverage badge
        env:
          NET_ID: ${{ secrets.NET_ID }}
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          coverage=$(jq -r '.total.lines.pct' coverage/coverage-summary.json)

          if awk "BEGIN {exit !($coverage < 80)}"; then
            color=red
          else
            color=green
          fi

          result=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            --get \
            --data-urlencode "label=Coverage" \
            --data-urlencode "value=${coverage}%" \
            --data-urlencode "color=$color" \
            -H "authorization: bearer $FACTORY_API_KEY" \
            "https://pizza-factory.cs329.click/api/badge/$NET_ID/jwtpizzacoverage")

          if [ "$result" != "200" ]; then
            echo "Badge generation failed: HTTP $result"
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > public/version.json

      - name: Build
        run: |
          npm ci && npm run build
          cp dist/index.html dist/404.html

      - name: Update pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

  deploy:
    needs: [build, test]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
