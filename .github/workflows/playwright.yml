
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: pizza
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -ptest_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      CI: "true"
      ADMIN_EMAIL: ci-admin@jwt.test
      ADMIN_PASSWORD: ci-test-password-123
      VITE_PIZZA_SERVICE_URL: http://localhost:3000
      VITE_PIZZA_FACTORY_URL: https://pizza-factory.cs329.click

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: jmanderson5/jwt-pizza-service
          path: jwt-pizza-service

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: jwt-pizza-service
        run: npm ci

      - name: Configure test backend
        working-directory: jwt-pizza-service
        run: |
          node <<'NODE'
          const fs = require('fs');

          const config = {
            jwtSecret: 'ci-only-jwt-secret-not-for-production',
            db: {
              connection: {
                host: '127.0.0.1',
                user: 'root',
                password: 'test_root_password',
                database: 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: 'https://pizza-factory.cs329.click',
              apiKey: 'ci-placeholder-key',
            },
          };

          fs.writeFileSync(
            'src/config.js',
            'module.exports = ' + JSON.stringify(config, null, 2) + ';\n'
          );
          NODE

      - name: Start backend
        working-directory: jwt-pizza-service
        run: |
          nohup npm start > /tmp/jwt-pizza-service.log 2>&1 &
          echo $! > /tmp/jwt-pizza-service.pid

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/order/menu > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/jwt-pizza-service.log
          exit 1

      - name: Create test administrator
        working-directory: jwt-pizza-service
        run: |
          node src/init.js "CI Test Admin" "$ADMIN_EMAIL" "$ADMIN_PASSWORD"

      - name: Verify administrator login
        run: |
          node <<'NODE'
          (async () => {
            const response = await fetch('http://localhost:3000/api/auth', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email: process.env.ADMIN_EMAIL,
                password: process.env.ADMIN_PASSWORD,
              }),
            });

            if (!response.ok) {
              throw new Error(`Admin login failed: ${response.status}`);
            }

            const data = await response.json();
            if (!data.token) {
              throw new Error('No admin token returned');
            }

            console.log('Administrator login verified');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests with coverage
        run: npm run test:coverage

      - name: Show backend logs on failure
        if: failure()
        run: |
          if [ -f /tmp/jwt-pizza-service.log ]; then
            cat /tmp/jwt-pizza-service.log
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
